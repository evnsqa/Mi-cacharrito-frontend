<main class="contacto-page">
  <header class="contacto-heading">
    <p class="contacto-eyebrow">Estamos para ayudarte</p>
    <h1>Contáctanos</h1>
    <p>¿Tienes sugerencias o quieres hacer un pedido especial? ¡Te responderemos lo antes posible!</p>
  </header>

  <section class="contacto-grid container" aria-label="Información de contacto y ubicación">
    <article class="contacto-card contacto-info">
      <div>
        <span class="contacto-icono"><i class="bi bi-geo-alt-fill" aria-hidden="true"></i></span>
        <div><h2>Dirección</h2><p>Calle 12 #34 - 56, La Dorada, Caldas</p></div>
      </div>
      <div>
        <span class="contacto-icono"><i class="bi bi-telephone-fill" aria-hidden="true"></i></span>
        <div><h2>Teléfono</h2><p><a href="tel:+573001234567">+57 300 123 4567</a></p></div>
      </div>
      <div>
        <span class="contacto-icono"><i class="bi bi-envelope-fill" aria-hidden="true"></i></span>
        <div><h2>Correo</h2><p><a href="mailto:contacto@micacharrito.com">contacto&#64;micacharrito.com</a></p></div>
      </div>
      <div>
        <span class="contacto-icono"><i class="bi bi-clock-fill" aria-hidden="true"></i></span>
        <div><h2>Horario</h2><p>Lunes a sábado, de 8:00 a. m. a 7:00 p. m.</p></div>
      </div>
    </article>

    <div class="contacto-card contacto-mapa">
      <iframe
        title="Mapa de ubicación de Cacharrito en La Dorada, Caldas"
        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3969.362145700201!2d-74.67057038522339!3d5.454942996024106!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x8e40dfa1d8281313%3A0xc480e6fc8dafa492!2sLa%20Dorada%2C%20Caldas%2C%20Colombia!5e0!3m2!1ses!2sco!4v1698335000000!5m2!1ses!2sco"
        loading="lazy"
        referrerpolicy="no-referrer-when-downgrade"
        allowfullscreen>
      </iframe>
    </div>
  </section>
</main>

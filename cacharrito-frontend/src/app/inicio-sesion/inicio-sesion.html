<app-navegacion></app-navegacion>
<div class="container-fluid p-0 bg-obsidiana">
  <div class="row g-0 min-vh-100">
    <div class="col-12 col-lg-6 d-flex align-items-center justify-content-center p-5">

      <div class="contenedor-form">
        <h2 class="text-perla fw-bold mb-2">Bienvenido a Mi Cacharrito</h2>
        <p class="text-grafito mb-5">Inicia sesión para realizar tu reserva de vehículos.</p>

        <form (ngSubmit)="iniciarSesion()">
          <div class="mb-4">
            <label for="identificacion" class="label-pequeno fw-bold">Número de identificación</label>
            <input type="text" class="form-control input-linea" id="identificacion" name="usuarioLogin"
              [(ngModel)]="usuarioLogin" required maxlength="20">
          </div>

          <div class="mb-5">
            <label for="password" class="label-pequeno fw-bold">Contraseña</label>
            <input type="password" class="form-control input-linea" id="password" name="passwordLogin"
              [(ngModel)]="passwordLogin" required maxlength="72">
          </div>

          <div class="mb-5 form-check d-flex align-items-center">
            <input type="checkbox" class="form-check-input me-2 shadow-none" id="recordarme"
              style="border-color: #333; background-color: transparent;">
            <label class="form-check-label text-grafito" for="recordarme" style="font-size: 0.9rem;">
              Recordar mis datos
            </label>
          </div>

          <button type="submit" class="btn btn-acento rounded-pill px-5 py-2 fw-bold">
            Iniciar sesión
          </button>
        </form>
      </div>
    </div>
    <div class="col-lg-6 d-none d-lg-block imagen-mitad">
    </div>
  </div>
</div>

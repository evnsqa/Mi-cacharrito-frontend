<app-navegacion></app-navegacion>
<div class="container-fluid bg-brillo d-flex align-items-center justify-content-center py-5">

  <div class="col-12 col-md-10 col-lg-8">
    <div class="glass-card p-4 p-md-5">

      <div class="text-center mb-5">
        <span class="badge mb-2">Nuevo Conductor</span>
        <h2 class="text-perla fw-bold">Crea tu cuenta en Mi Cacharrito</h2>
        <p class="text-grafito">Completa tu perfil para acceder a nuestra flota de vehículos.</p>
      </div>

      <form (ngSubmit)="registrar()">
        <div class="row g-4">

          <div class="col-md-6">
            <h5 class="text-perla mb-3"><i class="bi bi-person me-2"></i>Datos Personales</h5>

            <div class="form-floating mb-3">
              <input type="text" class="form-control input-cristal" id="nombre" name="nombreCompleto"
                [(ngModel)]="usuarioNuevo.nombreCompleto" placeholder="Nombre completo" required>
              <label for="nombre">Nombre completo</label>
            </div>

            <div class="form-floating mb-3">
              <input type="number" class="form-control input-cristal" id="identificacion" name="idUsuario"
                [(ngModel)]="usuarioNuevo.idUsuario" placeholder="Número de identificación" required>
              <label for="identificacion">Número de identificación</label>
            </div>

            <div class="form-floating mb-3">
              <input type="email" class="form-control input-cristal" id="correo" name="correoElectronico"
                [(ngModel)]="usuarioNuevo.correoElectronico" placeholder="name@example.com" required>
              <label for="correo">Correo electrónico</label>
            </div>

            <div class="form-floating mb-3">
              <input type="password" class="form-control input-cristal" id="password" name="password"
                [(ngModel)]="usuarioNuevo.password" placeholder="Contraseña" required>
              <label for="password">Contraseña</label>
            </div>
          </div>

          <div class="col-md-6">
            <h5 class="text-perla mb-3" style="font-size: 1rem;"><i class="bi bi-card-heading me-2"></i>Datos de
              Conducción</h5>

            <div class="form-floating mb-3">
              <input type="tel" class="form-control input-cristal" id="telefono" name="telefono"
                [(ngModel)]="usuarioNuevo.telefono" placeholder="Teléfono" required>
              <label for="telefono">Número de teléfono</label>
            </div>

            <div class="form-floating mb-3">
              <select class="form-select input-cristal" id="categoria" name="categoriaLicencia"
                [(ngModel)]="usuarioNuevo.categoriaLicencia" aria-label="Categoría de licencia" required>
                <option selected disabled value="">Selecciona una categoría</option>
                <option value="A2">A2 (Motocicletas)</option>
                <option value="B1">B1 (Automóviles, camperos)</option>
                <option value="B2">B2 (Camiones, buses)</option>
                <option value="C1">C1 (Público - Automóviles)</option>
              </select>
              <label for="categoria">Categoría de licencia</label>
            </div>

            <div class="form-floating mb-3">
              <input type="date" class="form-control input-cristal" id="expedicion" name="fechaExpedicionLicencia"
                [(ngModel)]="usuarioNuevo.fechaExpedicionLicencia" required>
              <label for="expedicion">Fecha de expedición</label>
            </div>

            <div class="form-floating mb-3">
              <input type="date" class="form-control input-cristal" id="vigencia" name="vigenciaLicencia"
                [(ngModel)]="usuarioNuevo.vigenciaLicencia" required>
              <label for="vigencia">Vigencia (Vencimiento)</label>
            </div>
          </div>

        </div>

        <div class="text-center mt-5">
          <button type="submit" class="btn btn-degradado w-100 py-3 fw-bold fs-5 mb-3">Registrarse y Empezar</button>
          <p class="text-grafito">¿Ya tienes una cuenta? <a routerLink="/login" class="link-inicio">Inicia sesión aquí</a></p>
        </div>

      </form>
    </div>
  </div>
</div>
